name: build
intent_tags:
  - proposal
  - full-lifecycle
start: draft
nodes:
  - id: draft
    block: author.proposal
    params:
      with_user: true
    next: feature
    on_fail: draft
  - id: feature
    block: branch.open
    params:
      base: trunk
    next: scout
  - id: scout
    block: understand
    params:
      brief: true
      delegate: luna
      with_user: false
    next: plan
    on_fail: scout
  - id: plan
    block: author.plan
    in:
      proposal: scout.out
    params:
      delegate: fable
      max_rounds: 60
      require_brief: true
    next: plan_gate
    on_fail: plan
  - id: plan_gate
    block: gate.roundtable
    in:
      src: plan.out
    params:
      focus: does this implementation plan fully satisfy the proposal/request?
      max_rounds: 6
      panel:
        eligible:
          - contrarian
        required:
          - reviewer
          - qa
      quorum: 2
      roundtable: plan
    on_pass: split
    on_fail: plan
  - id: split
    block: split
    in:
      plan: plan.out
    next: slices
    on_fail: split
    params:
      delegate: fable
  - id: slices
    block: foreach.workflow
    in:
      feature: feature.out
      packets: split.out
    params:
      max_rounds: 3
      workflow: slice
    next: accept_freeze
    on_fail: split
  - id: accept_freeze
    block: freeze
    in:
      branch: slices.out
    next: gemini_review
  - id: gemini_review
    block: review
    in:
      src: accept_freeze.out
    params:
      delegate: antigravity
      require_code_review_skill: true
      task: Apply the repository code-review skill across the Standards and Spec axes.
    next: sol_review
    on_fail: split
  - id: sol_review
    block: review
    in:
      src: accept_freeze.out
    params:
      delegate: sol
      require_code_review_skill: true
      task: Apply the repository code-review skill across the Standards and Spec axes.
    next: fable_judgment
    on_fail: split
  - id: fable_judgment
    block: review
    in:
      src: accept_freeze.out
    params:
      delegate: fable
      persona: chairman
      task: Make the final acceptance judgment after the Gemini and Sol code-review-skill passes. Confirm the requested behavior is complete and reject any surviving blocker before documentation and pull-request handoff.
    next: document
    on_fail: split
  - id: document
    block: document
    in:
      branch: slices.out
    params:
      delegate: muse
    next: doc_freeze
    on_fail: document
  - id: doc_freeze
    block: freeze
    in:
      branch: document.out
    next: doc_gate
  - id: doc_gate
    block: gate.roundtable
    in:
      src: doc_freeze.out
    params:
      focus: is the documentation complete, accurate, and clear for this feature?
      max_rounds: 6
      panel:
        eligible:
          - technical-writer
        required:
          - reviewer
          - qa
      quorum: 2
      roundtable: documentation
    on_pass: archive
    on_fail: document
  - id: archive
    block: source.archive
    in:
      branch: document.out
    next: final_pr
  - id: final_pr
    block: pr.open
    in:
      src: doc_freeze.out
    params:
      base: default
