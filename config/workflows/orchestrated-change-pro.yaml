# orchestrated-change with a verify-then-adversarial review ladder.
#
# prep (luna brief) -> plan (fable, the ONE capped premium planning call) ->
# implement (deepseek) -> freeze -> review ladder:
#
#   gemini_review antigravity (Gemini 3.7   initial PR review along two axes:
#                 Flash, high)              standards/correctness and
#                                           spec-compliance with the request
#   sol_review    sol-review (Codex,        adversarially VERIFIES gemini's
#                 gpt-5.6-sol, high effort) findings (discarding what it
#                                           cannot confirm) and conducts its
#                                           own independent adversarial review
#
# Gemini's verdict never gates delivery by itself: pass or fail, the diff
# goes to sol next. When gemini requested changes, sol receives those
# findings to verify; when gemini approved, sol reviews cold. Only findings
# sol itself asserts return to the deepseek implementer, so a cheap seat's
# false positives cannot block delivery and a cheap seat's approval cannot
# green-light it. After a repair the re-frozen diff climbs the whole ladder
# again; the draft pull request opens only when sol approves with zero
# findings, and the run then parks at the human gate.
#
# sol-review is a distinct delegate entry from the ledgered `sol` escalation
# seat on purpose: iterate-until-clean needs repeated senior review rounds,
# so the rungs are bounded by max_rounds and no-progress convergence
# detection rather than the premium planning ledger, which keeps guarding
# fable. Codex reasoning effort comes from ~/.codex/config.toml
# (model_reasoning_effort = "high").
name: orchestrated-change-pro
intent_tags:
  - feature
  - multi-file-change
  - refactor
  - architecture
  - high-stakes
enforced: true
start: prep
nodes:
  - id: prep
    block: understand
    params:
      brief: true
      delegate: luna
      max_rounds: 2
    next: plan
    on_fail: prep
  # The single premium planning call. Its only inputs are the immutable
  # original request and the validated ContextBrief.
  - id: plan
    block: author.plan
    in:
      proposal: prep.out
    params:
      delegate: fable
      persona: architect
      require_brief: true
      max_rounds: 2
    next: implement
    on_fail: prep
  - id: implement
    block: implement
    in:
      plan: plan.out
    params:
      delegate: deepseek
      max_rounds: 2
    next: freeze
    on_fail: implement
  - id: freeze
    block: freeze
    in:
      branch: implement.out
    next: gemini_review
  # Rung 1: the initial PR review. Both edges lead to sol: findings travel
  # there for verification, and an approval still gets an independent
  # adversarial pass.
  - id: gemini_review
    block: review
    in:
      src: freeze.out
    params:
      delegate: antigravity
      persona: reviewer
      task: >-
        Conduct the initial pull-request review of this frozen diff along two
        axes. Standards: is the change correct, safe, and consistent with the
        conventions visible in the artifact? Spec: does it do exactly what the
        original request asked, nothing missing and nothing extra? Report
        every real problem as a finding with a severity; do not pad findings
        with style nits you would not block a merge on. You may explore the
        repository with your read-only file tools (view_file, grep_search,
        list_dir, find_by_name) to check callers and conventions; shell
        commands and writes are unavailable to you.
      max_rounds: 4
    on_pass: sol_review
    on_fail: sol_review
  # Rung 2: senior verification and adversarial review on gpt-5.6-sol.
  - id: sol_review
    block: review
    in:
      src: freeze.out
    params:
      delegate: sol-review
      persona: architect
      task: >-
        You are the senior verifying reviewer. If prior reviewer findings are
        attached, adversarially verify each one against the diff and discard
        any you cannot confirm as a real problem. Then conduct your own
        independent adversarial review of the frozen diff along the same two
        axes (standards and spec-compliance), actively trying to find what the
        previous reviewer missed. Approve only if no confirmed or new
        findings remain.
      max_rounds: 4
    on_pass: pr
    on_fail: implement
  - id: pr
    block: pr.open
    in:
      src: freeze.out
    params:
      base: trunk
    next: human_gate
  - id: human_gate
    block: gate.human
    in:
      src: pr.out
    params:
      policy: gemini reviewed and sol verified this frozen diff; approve delivery
    on_pass: deliver
    on_fail: implement
  - id: deliver
    block: gate.deliver
    in:
      verdict: human_gate.out
