# Child `slice` workflow for one packet of a parent `build` run.
#
# `foreach.workflow` starts one child per packet. Each child implements its packet,
# freezes and reviews the diff, opens a slice PR, waits for green CI, then merges
# into the parent feature branch. The child completes only after merge.
name: slice
intent_tags:
  - slice
start: source
nodes:
  # Preserve the immutable admitted packet using the native proposal contract.
  - id: source
    block: author.proposal
    next: scope
  # Scout both the admitted request and, on repair passes, the current frozen
  # implementation plus the latest structured review findings.
  - id: scope
    block: understand
    params:
      with_user: false
      delegate: luna
      current_artifact: freeze
      max_rounds: 3
    next: plan
    on_fail: scope
  # Sol converts scouting into a validated, judgment-free implementation plan.
  - id: plan
    block: author.plan
    in:
      proposal: source.out
    params:
      delegate: sol
      mechanical: true
      scout_artifact: scope
      current_artifact: freeze
      max_rounds: 3
    next: impl
    on_fail: plan
  # Implement the packet on the slice branch.
  - id: impl
    block: implement
    in:
      plan: plan.out
    params:
      delegate: luna
      max_rounds: 3
    next: freeze
    on_fail: scope
  - id: freeze
    block: freeze
    in:
      branch: impl.out
    next: sol_review
  # The deterministic repository review precedes the broader roundtable.
  - id: sol_review
    block: review
    in:
      src: freeze.out
    params:
      delegate: sol
      require_code_review_skill: true
      task: Apply the repository code-review skill across the Standards and Spec axes.
      max_rounds: 3
    next: rt_gate
    on_fail: scope
  # Review findings restart scouting; they never go raw to implementation.
  - id: rt_gate
    block: gate.roundtable
    in:
      src: freeze.out
    params:
      roundtable: implementation
      panel:
        required:
          - qa
          - reviewer
      quorum: 2
      max_rounds: 3
    on_pass: pr
    on_fail: scope
  # Open the slice sub-PR (targets the parent feature branch).
  - id: pr
    block: pr.open
    in:
      src: freeze.out
    params:
      # A slice PR must target the parent's `aimee/feat/<parent>` branch. The forge
      # boundary rejects a slice merge into the admitted integration branch.
      base: feature
    next: ci
    # Retry a requested forge correction within the node budget.
    on_fail: pr
  # CI must be fully green before the slice may merge.
  - id: ci
    block: gate.ci
    in:
      pr: pr.out
    on_pass: merge
    on_fail: scope
  # Merge the green, approved slice into the feature branch. Terminal: slice done.
  - id: merge
    block: merge
    in:
      pr: pr.out
