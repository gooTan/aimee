# Subscription-factory workflow for changes that deserve one premium plan.
#
# prep (ContextBrief) -> plan (ONE premium call) -> implement -> freeze ->
# review -> [escalate: second premium opinion] -> draft PR -> human gate ->
# deliver
#
# Seats: `luna` (cheap Codex model) prepares a typed, size-bounded ContextBrief
# and reviews frozen diffs; `fable` (premium, via the Claude CLI) makes exactly
# one planning call on the happy path; `sol` (premium, via Codex) is reachable
# only over the review node's `on_escalate` edge, and only when the reviewer
# classifies a blocking finding as an architecture, security, migration,
# contract, or requirement decision. `deepseek` (OpenCode ACP, DeepSeek V4
# Flash) implements and repairs.
#
# The engine's premium ledger enforces the budget: the run tree cannot exceed
# AIMEE_PREMIUM_CALL_CAP (default two) premium dispatches, premium delegates
# are refused write capability, and `require_brief` rejects any planning input
# that is not a valid ContextBrief before a premium delegate is dispatched.
# Sol and Fable are never both called automatically: Fable plans, and Sol runs
# only on an explicit escalation classification.
#
# Routine verifier failures and review findings return directly to the
# implementer (`on_fail: implement`) with bounded rounds; they never touch a
# premium seat. Delivery is a draft PR that stops at a human gate.
name: orchestrated-change
intent_tags:
  - feature
  - multi-file-change
  - refactor
  - architecture
enforced: true
start: prep
nodes:
  - id: prep
    block: understand
    params:
      brief: true
      delegate: luna
      max_rounds: 2
    next: plan
    on_fail: prep
  # The single premium planning call. Its only inputs are the immutable
  # original request and the validated ContextBrief.
  - id: plan
    block: author.plan
    in:
      proposal: prep.out
    params:
      delegate: fable
      persona: architect
      require_brief: true
      max_rounds: 2
    next: implement
    on_fail: prep
  - id: implement
    block: implement
    in:
      plan: plan.out
    params:
      delegate: deepseek
      max_rounds: 2
    next: freeze
    on_fail: implement
  - id: freeze
    block: freeze
    in:
      branch: implement.out
    next: review
  # Luna reviews the frozen diff. Routine findings go straight back to the
  # implementer; a genuine architecture/security/migration/contract/requirement
  # decision takes the escalation edge to the one allowed second opinion.
  - id: review
    block: review
    in:
      src: freeze.out
    params:
      delegate: luna
      persona: reviewer
      max_rounds: 3
    on_pass: pr
    on_fail: implement
    on_escalate: second_opinion
  # Sol's second opinion is the only other premium call the graph can reach,
  # and the premium ledger caps the run tree regardless.
  - id: second_opinion
    block: review
    in:
      src: freeze.out
    params:
      delegate: sol
      persona: architect
      max_rounds: 2
    on_pass: pr
    on_fail: implement
  - id: pr
    block: pr.open
    in:
      src: freeze.out
    params:
      base: trunk
    next: human_gate
  # The draft PR stops here. Automation cannot approve a human gate; the
  # browser or /v1/workflow/items/{id}/gate decision is the only way through.
  - id: human_gate
    block: gate.human
    in:
      src: pr.out
    params:
      policy: review the draft pull request and approve delivery
    on_pass: deliver
  - id: deliver
    block: gate.deliver
    in:
      verdict: human_gate.out
