name: build
intent_tags:
    - proposal
    - full-lifecycle
start: draft
nodes:
    - id: draft
      block: author.proposal
      params:
        with_user: true
      next: prep
      on_fail: draft
    - id: prep
      block: understand
      params:
        brief: true
        delegate: luna
        max_rounds: 2
      next: feature
      on_fail: prep
    - id: feature
      block: branch.open
      params:
        base: trunk
      next: plan
    - id: plan
      block: author.plan
      in:
        proposal: draft.out
      params:
        delegate: luna
        max_rounds: 2
        require_brief: true
      next: plan_gate
      on_fail: plan
    - id: plan_gate
      block: gate.roundtable
      in:
        src: plan.out
      params:
        focus: does this implementation plan fully satisfy the proposal/request?
        max_rounds: 3
        panel:
            required:
                - qa
                - reviewer
        quorum: 2
        roundtable: plan
      on_pass: split
      on_fail: plan
    - id: split
      block: split
      in:
        plan: plan.out
      next: slices
      on_fail: split
    - id: slices
      block: foreach.workflow
      in:
        feature: feature.out
        packets: split.out
      params:
        max_rounds: 3
        workflow: slice
      next: accept_freeze
      on_fail: split
    - id: accept_freeze
      block: freeze
      in:
        branch: slices.out
      next: sol_review
    - id: sol_review
      block: review
      in:
        src: accept_freeze.out
      params:
        delegate: sol
        max_rounds: 3
        require_code_review_skill: true
        task: Apply the repository code-review skill across the Standards and Spec axes.
      next: document
      on_fail: repair_scope
    - id: repair_scope
      block: understand
      params:
        current_artifact: accept_freeze
        delegate: luna
        max_rounds: 3
        with_user: false
      next: repair_plan
      on_fail: repair_scope
    - id: repair_plan
      block: author.plan
      in:
        proposal: draft.out
      params:
        current_artifact: accept_freeze
        delegate: sol
        max_rounds: 3
        mechanical: true
        scout_artifact: repair_scope
      next: repair_impl
      on_fail: repair_plan
    - id: repair_impl
      block: implement
      in:
        plan: repair_plan.out
      params:
        delegate: luna
        max_rounds: 3
      next: accept_freeze
      on_fail: repair_scope
    - id: document
      block: document
      in:
        branch: slices.out
      next: doc_freeze
      on_fail: document
    - id: doc_freeze
      block: freeze
      in:
        branch: document.out
      next: doc_gate
    - id: doc_gate
      block: gate.roundtable
      in:
        src: doc_freeze.out
      params:
        focus: is the documentation complete, accurate, and clear for this feature?
        max_rounds: 3
        panel:
            required:
                - qa
                - reviewer
        quorum: 2
        roundtable: documentation
      on_pass: archive
      on_fail: document
    - id: archive
      block: source.archive
      in:
        branch: document.out
      next: final_pr
    - id: final_pr
      block: pr.open
      in:
        src: doc_freeze.out
      params:
        base: default
